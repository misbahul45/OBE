name: obe-tb

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: obe-tb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-obe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obe_dev_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - obe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - obe_net

volumes:
  obe_postgres_data:

networks:
  obe_net:
    name: obe-tb-net
